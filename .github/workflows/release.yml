name: Release

on:
  push:
    tags:
      - "better-sqlite3-v*-electron-v*-r*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Register ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Test build tooling
        run: npm test

      - name: Build and verify x64 and ARM64 addons
        run: npm run build

      - name: Prepare release assets
        run: npm run prepare:release -- "$GITHUB_REF_NAME"

      - name: Attest release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
